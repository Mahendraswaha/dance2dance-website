## Sumário Executivo

Este documento define a estratégia integrada de crescimento da Dance2Dance, conectando **aquisição de público → conversão em lead → transformação em cliente → retenção e advocacy**. A estratégia opera com **orçamento zero de mídia paga**, alavancando conteúdo orgânico, parcerias locais e a história autêntica da organização como moeda de troca.

> [!IMPORTANT]
> **Princípio Central:** Toda ação de marketing deve alimentar o CRM. Todo conteúdo deve ter um CTA. Todo CTA deve capturar um dado. Todo dado deve gerar uma ação automatizada.

## 2. Estratégia de Conteúdo — "O Motor Orgânico"

> [!TIP]
> **Regra de Ouro do Orçamento Zero:** O conteúdo É o marketing. Cada aula, cada workshop, cada momento no estúdio é matéria-prima para semanas de conteúdo. Grave tudo. Fotografe tudo. Documente tudo.

| **Educativo** | 40% | "O que é consciência corporal?", "5 min de Biostretch no escritório", "Como a dança melhora a saúde mental" |
| **Inspiracional** | 25% | Histórias de transformação de alunos, jornada da Safia, bastidores de workshops |
| **Comunitário** | 20% | Tøyen & Grønland, impacto social, diversidade cultural, eventos locais |
| **Promocional** | 15% | Agenda de workshops, vagas abertas, lançamentos, depoimentos |

### 2.4 O Avatar da Safia — Estratégia de IA

> [!NOTE]
> **Recomendação:** Use a imagem real da Safia como protagonista — não um avatar IA. A autenticidade é o maior ativo de uma organização sem fins lucrativos. Avatares IA podem parecer artificiais e minar a confiança.

**O que FAZER com IA:**
- Usar IA para **gerar roteiros** de vídeos e posts
- Usar IA para **editar vídeos** (legendas automáticas, cortes inteligentes)
- Usar IA para **traduzir conteúdo** para NO/EN/PT simultaneamente
- Usar IA para **gerar thumbnails** e assets visuais para posts
- Usar IA para **analisar métricas** e sugerir otimizações

**O que NÃO fazer com IA:**
- Não substituir a presença real da Safia por um avatar digital
- Não gerar texto sem revisão humana (pode soar genérico)
- Não criar "fake engagement" (bots, comentários falsos)
