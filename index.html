<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D0D12" />
    <title>Dance2Dance — Movement, Wellbeing & Performance in Oslo</title>
    <meta name="description" content="Dance2Dance offers transformative movement programs in Oslo — Be The Dance, Biostretch and Kroppsskole. Corporate wellness, workshops and individual sessions." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- Schema.org: LocalBusiness structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Dance2Dance",
      "url": "https://dance2dance.no",
      "logo": "https://dance2dance.no/logo-dance2dance.png",
      "description": "Dance2Dance offers transformative movement programs in Oslo — Be The Dance, Biostretch and Kroppsskole.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Oslo",
        "addressCountry": "NO"
      },
      "sameAs": [
        "https://www.instagram.com/dance2dance.no",
        "https://poaciadanca.com.br/en/"
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Dance2Dance Programs",
        "itemListElement": [
          { "@type": "Offer", "name": "Be The Dance", "url": "https://dance2dance.no/be-the-dance" },
          { "@type": "Offer", "name": "Biostretch", "url": "https://dance2dance.no/biostretch" },
          { "@type": "Offer", "name": "Kroppsskole", "url": "https://dance2dance.no/kroppsskole" }
        ]
      }
    }
    </script>
  </head>
  <body>
    <!-- Global Noise Overlay -->
    <svg style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; opacity: 0.05;">
      <filter id="noiseFilter">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
    </svg>
    
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
