<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href='https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap' rel='stylesheet'>
<style>
body { background: #0d0d12; color: #F0EDE8; font-family: 'Playfair Display', serif; font-size: 24px; padding: 40px; }
.accent { color: #C9A84C; }
.lnum { font-variant-numeric: lining-nums; }
.row { margin-bottom: 20px; display: flex; align-items: baseline; }
.label { width: 250px; font-family: sans-serif; font-size: 14px; color: #888; }
.sample { position: relative; border-bottom: 1px solid rgba(255,255,255,0.2); }
</style>
</head>
<body>
<div class="row"><div class="label">Original (24px):</div><div class="sample">Dance<span class="accent">2</span>Dance</div></div>
<div class="row"><div class="label">lnum (lining figures):</div><div class="sample">Dance<span class="accent lnum">2</span>Dance</div></div>
<div class="row"><div class="label">size +3 (27px):</div><div class="sample">Dance<span class="accent" style="font-size: 27px;">2</span>Dance</div></div>
<div class="row"><div class="label">size 30px:</div><div class="sample">Dance<span class="accent" style="font-size: 30px;">2</span>Dance</div></div>
<div class="row"><div class="label">size 32px (1.33em):</div><div class="sample">Dance<span class="accent" style="font-size: 32px;">2</span>Dance</div></div>
<div class="row"><div class="label">size 34px (1.42em):</div><div class="sample">Dance<span class="accent" style="font-size: 34px;">2</span>Dance</div></div>
</body>
</html>
